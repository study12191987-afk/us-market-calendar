<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>US Market Calendar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050914;
      --panel: rgba(13, 23, 42, 0.88);
      --panel2: rgba(17, 30, 54, 0.78);
      --line: rgba(148, 163, 184, 0.14);

      --text: #f8fafc;
      --muted: #8493a8;

      --blue: #38bdf8;
      --purple: #a78bfa;
      --red: #fb7185;
      --orange: #fbbf24;
      --green: #34d399;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(37, 99, 235, 0.20),
          transparent 30%
        ),
        radial-gradient(
          circle at 100% 15%,
          rgba(124, 58, 237, 0.15),
          transparent 25%
        ),
        var(--bg);
    }

    .app {
      width: min(1180px, 94%);
      margin: auto;
      padding: 34px 0 60px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 28px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 5vw, 44px);
      letter-spacing: -1.5px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #c7ddff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .live {
      color: var(--green);
      font-size: 12px;

      border:
        1px solid
        rgba(52, 211, 153, 0.25);

      background:
        rgba(52, 211, 153, 0.07);

      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    /* =========================
       NEXT 7 DAYS
    ========================= */

    .upcoming {
      display: flex;
      gap: 12px;

      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 26px;

      scrollbar-width: thin;
    }

    .upcoming-card {
      flex: 0 0 220px;
      min-height: 118px;
      padding: 16px;

      border-radius: 16px;
      border: 1px solid var(--line);

      background:
        linear-gradient(
          145deg,
          rgba(20, 34, 59, 0.95),
          rgba(8, 15, 29, 0.92)
        );

      transition:
        transform .2s ease,
        border-color .2s ease,
        background .2s ease;

      cursor: pointer;
    }

    .upcoming-card:hover {
      transform: translateY(-2px);

      border-color:
        rgba(56, 189, 248, 0.35);

      background:
        linear-gradient(
          145deg,
          rgba(24, 42, 72, 0.98),
          rgba(9, 17, 31, 0.96)
        );
    }

    .upcoming-date {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 11px;
    }

    .upcoming-title-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
    }

    .upcoming-title {
      font-weight: 700;
      line-height: 1.35;
      font-size: 14px;
    }

    .upcoming-type {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    /* =========================
       MAIN GRID
    ========================= */

    .main-grid {
      display: grid;
      grid-template-columns:
        1.45fr .85fr;

      gap: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;

      background:
        linear-gradient(
          160deg,
          rgba(15, 27, 48, 0.94),
          rgba(7, 13, 25, 0.94)
        );

      box-shadow:
        0 24px 60px
        rgba(0, 0, 0, 0.22);

      overflow: hidden;
    }

    /* =========================
       CALENDAR
    ========================= */

    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding:
        22px
        22px
        15px;
    }

    .month-title {
      font-size: 20px;
      font-weight: 750;
      letter-spacing: .5px;
    }

    .calendar-controls {
      display: flex;
      gap: 8px;
    }

    button {
      color: var(--text);

      background:
        rgba(255, 255, 255, 0.04);

      border:
        1px solid var(--line);

      width: 36px;
      height: 36px;

      border-radius: 10px;

      cursor: pointer;
      font-size: 17px;
    }

    button:hover {
      border-color:
        rgba(56, 189, 248, .5);
    }

    .weekdays {
      display: grid;
      grid-template-columns:
        repeat(7, 1fr);

      padding:
        0 14px;

      color: var(--muted);

      font-size: 10px;
      letter-spacing: 1px;
      text-align: center;
    }

    .weekdays div {
      padding:
        10px 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns:
        repeat(7, 1fr);

      padding:
        0 14px 18px;
    }

    .day {
      position: relative;
      min-height: 84px;
      padding: 10px;

      border-top:
        1px solid var(--line);

      border-right:
        1px solid var(--line);

      cursor: pointer;

      transition:
        background .15s ease;
    }

    .day:nth-child(7n) {
      border-right: none;
    }

    .day:hover {
      background:
        rgba(56, 189, 248, .045);
    }

    .day.empty {
      cursor: default;
      opacity: .2;
    }

    .day-number {
      font-size: 13px;
      color: #cbd5e1;
    }

    .today .day-number {
      display: inline-flex;

      justify-content: center;
      align-items: center;

      width: 27px;
      height: 27px;

      border-radius: 50%;

      background: var(--blue);
      color: #04111d;

      font-weight: 800;
    }

    .selected {
      background:
        rgba(56, 189, 248, .07);
    }

    .dots {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;

      margin-top: 9px;
    }

    /* =========================
       EVENT COLORS
    ========================= */

    .dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      display: inline-block;

      flex-shrink: 0;
    }

    .dot-fed {
      background: var(--red);

      box-shadow:
        0 0 8px
        rgba(251, 113, 133, .55);
    }

    .dot-macro {
      background: var(--orange);

      box-shadow:
        0 0 8px
        rgba(251, 191, 36, .28);
    }

    .dot-earnings {
      background: var(--blue);

      box-shadow:
        0 0 8px
        rgba(56, 189, 248, .30);
    }

    /* =========================
       EVENT BADGES
    ========================= */

    .event-badge {
      width: 13px;
      height: 13px;

      border-radius: 50%;

      margin-top: 3px;

      flex:
        0 0 13px;
    }

    .badge-fed {
      background: var(--red);

      box-shadow:
        0 0 12px
        rgba(251, 113, 133, .42);
    }

    .badge-macro {
      background: var(--orange);

      box-shadow:
        0 0 12px
        rgba(251, 191, 36, .30);
    }

    .badge-earnings {
      background: var(--blue);

      box-shadow:
        0 0 12px
        rgba(56, 189, 248, .34);
    }

    .mini-badge {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      margin-top: 5px;

      flex:
        0 0 8px;
    }

    /* =========================
       EVENT DETAIL
    ========================= */

    .detail {
      padding: 22px;
    }

    .detail-date {
      color: var(--blue);

      font-size: 12px;
      letter-spacing: 1.7px;
      font-weight: 700;

      margin-bottom: 7px;
    }

    .detail-heading {
      font-size: 23px;
      font-weight: 750;

      margin-bottom: 20px;
    }

    .event-card {
      padding:
        15px 0;

      border-top:
        1px solid var(--line);
    }

    .event-card:first-of-type {
      border-top: none;
    }

    .event-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .event-content {
      min-width: 0;
    }

    .event-title {
      font-weight: 700;
      line-height: 1.35;
    }

    .event-meta {
      color: var(--muted);

      font-size: 12px;

      margin-top: 6px;

      line-height: 1.7;
    }

    .event-label {
      font-size: 10px;
      letter-spacing: 1px;
      font-weight: 700;

      margin-bottom: 4px;
    }

    .label-fed {
      color: var(--red);
    }

    .label-macro {
      color: var(--orange);
    }

    .label-earnings {
      color: var(--blue);
    }

    .empty-detail {
      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;

      padding-top: 20px;
    }

    /* =========================
       LEGEND
    ========================= */

    .legend {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;

      margin-top: 16px;

      color: var(--muted);

      font-size: 11px;
    }

    .legend-item {
      display: flex;

      align-items: center;

      gap: 7px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (
      max-width: 820px
    ) {

      .app {
        width: 94%;

        padding-top: 24px;
      }

      .header {
        align-items:
          flex-start;

        flex-direction:
          column;
      }

      .main-grid {
        grid-template-columns:
          1fr;
      }

      .day {
        min-height: 64px;
        padding: 7px;
      }

      .day-number {
        font-size: 12px;
      }

      .calendar-head {
        padding:
          18px
          15px
          12px;
      }

      .upcoming-card {
        flex:
          0 0 190px;
      }

    }

  </style>
</head>


<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">

    <div>

      <div class="eyebrow">
        MARKET INTELLIGENCE
      </div>

      <h1>
        US MARKET CALENDAR
      </h1>

      <div class="subtitle">
        美国市场重要事件 · 宏观 · FOMC · Earnings
      </div>

    </div>


    <div
      class="live"
      id="liveStatus"
    >
      ● DATA READY
    </div>

  </header>


  <!-- =========================
       NEXT 7 DAYS
  ========================== -->

  <div class="section-title">
    NEXT 7 DAYS
  </div>


  <div
    class="upcoming"
    id="upcoming"
  ></div>


  <!-- =========================
       MAIN
  ========================== -->

  <div class="main-grid">

    <!-- CALENDAR -->

    <section class="panel">

      <div class="calendar-head">

        <div
          class="month-title"
          id="monthTitle"
        ></div>


        <div class="calendar-controls">

          <button
            onclick="changeMonth(-1)"
            aria-label="Previous month"
          >
            ‹
          </button>


          <button
            onclick="goToday()"
            aria-label="Today"
          >
            •
          </button>


          <button
            onclick="changeMonth(1)"
            aria-label="Next month"
          >
            ›
          </button>

        </div>

      </div>


      <div class="weekdays">

        <div>SUN</div>
        <div>MON</div>
        <div>TUE</div>
        <div>WED</div>
        <div>THU</div>
        <div>FRI</div>
        <div>SAT</div>

      </div>


      <div
        class="calendar-grid"
        id="calendar"
      ></div>

    </section>


    <!-- DETAILS -->

    <section
      class="panel detail"
    >

      <div
        class="detail-date"
        id="detailDate"
      >
        SELECT A DATE
      </div>


      <div
        class="detail-heading"
        id="detailHeading"
      >
        Event Details
      </div>


      <div
        id="eventDetails"
        class="empty-detail"
      >
        点击日历中的日期查看当天的重要市场事件。
      </div>

    </section>

  </div>


  <!-- =========================
       LEGEND
  ========================== -->

  <div class="legend">

    <div class="legend-item">

      <span
        class="dot dot-fed"
      ></span>

      FED / FOMC

    </div>


    <div class="legend-item">

      <span
        class="dot dot-macro"
      ></span>

      MACRO

    </div>


    <div class="legend-item">

      <span
        class="dot dot-earnings"
      ></span>

      EARNINGS

    </div>

  </div>

</div>


<script>

  let calendarData = [];

  let currentDate =
    new Date();

  let selectedDate =
    null;


  /* =========================================
     LOAD DATA
  ========================================= */

  async function loadData() {

    try {

      const response =
        await fetch(
          "./calendar-data.json?ts="
          + Date.now()
        );


      if (!response.ok) {

        throw new Error(
          "calendar-data.json not found"
        );

      }


      const data =
        await response.json();


      calendarData =
        data.events || [];


      document.getElementById(
        "liveStatus"
      ).textContent =
        "● "
        + calendarData.length
        + " EVENTS LIVE";


      renderCalendar();

      renderUpcoming();


    } catch (error) {

      console.error(error);


      document.getElementById(
        "liveStatus"
      ).textContent =
        "● DATA ERROR";


      document.getElementById(
        "eventDetails"
      ).innerHTML =
        "无法读取 calendar-data.json。请使用本地服务器运行网页。";

    }

  }


  /* =========================================
     DATE HELPERS
  ========================================= */

  function toDateString(
    date
  ) {

    const year =
      date.getFullYear();


    const month =
      String(
        date.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        date.getDate()
      ).padStart(
        2,
        "0"
      );


    return (
      `${year}-${month}-${day}`
    );

  }


  function getEventsForDate(
    dateString
  ) {

    return calendarData.filter(
      event =>
        event.date
        === dateString
    );

  }


  /* =========================================
     CALENDAR
  ========================================= */

  function renderCalendar() {

    const year =
      currentDate.getFullYear();


    const month =
      currentDate.getMonth();


    const calendar =
      document.getElementById(
        "calendar"
      );


    calendar.innerHTML =
      "";


    const monthName =
      new Intl.DateTimeFormat(
        "en-US",
        {
          month: "long",
          year: "numeric"
        }
      ).format(
        new Date(
          year,
          month,
          1
        )
      );


    document.getElementById(
      "monthTitle"
    ).textContent =
      monthName.toUpperCase();


    const firstDay =
      new Date(
        year,
        month,
        1
      ).getDay();


    const daysInMonth =
      new Date(
        year,
        month + 1,
        0
      ).getDate();


    /* empty cells */

    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      const empty =
        document.createElement(
          "div"
        );


      empty.className =
        "day empty";


      calendar.appendChild(
        empty
      );

    }


    const todayString =
      toDateString(
        new Date()
      );


    for (
      let day = 1;
      day <= daysInMonth;
      day++
    ) {

      const date =
        new Date(
          year,
          month,
          day
        );


      const dateString =
        toDateString(
          date
        );


      const events =
        getEventsForDate(
          dateString
        );


      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "day";


      if (
        dateString
        === todayString
      ) {

        cell.classList.add(
          "today"
        );

      }


      if (
        dateString
        === selectedDate
      ) {

        cell.classList.add(
          "selected"
        );

      }


      cell.innerHTML = `
        <div class="day-number">
          ${day}
        </div>

        <div class="dots">
        </div>
      `;


      const dots =
        cell.querySelector(
          ".dots"
        );


      events.forEach(
        event => {

          const dot =
            document.createElement(
              "span"
            );


          dot.className =
            "dot dot-"
            + event.category;


          dots.appendChild(
            dot
          );

        }
      );


      cell.onclick = () => {

        selectedDate =
          dateString;


        renderCalendar();


        showDay(
          dateString
        );

      };


      calendar.appendChild(
        cell
      );

    }

  }


  /* =========================================
     EVENT DETAILS
  ========================================= */

  function showDay(
    dateString
  ) {

    const events =
      getEventsForDate(
        dateString
      );


    const date =
      new Date(
        dateString
        + "T12:00:00"
      );


    const label =
      new Intl.DateTimeFormat(
        "en-US",
        {
          weekday: "long",
          month: "long",
          day: "numeric"
        }
      ).format(
        date
      );


    document.getElementById(
      "detailDate"
    ).textContent =
      dateString;


    document.getElementById(
      "detailHeading"
    ).textContent =
      label;


    const container =
      document.getElementById(
        "eventDetails"
      );


    if (!events.length) {

      container.className =
        "empty-detail";


      container.innerHTML =
        "这一天目前没有我们追踪的重要市场事件。";


      return;

    }


    container.className =
      "";


    container.innerHTML =
      events
        .map(
          event =>
            eventCard(
              event
            )
        )
        .join("");

  }


  function eventCard(
    event
  ) {

    let type =
      "EARNINGS";


    let badgeClass =
      "badge-earnings";


    let labelClass =
      "label-earnings";


    if (
      event.category
      === "fed"
    ) {

      type =
        "FEDERAL RESERVE";


      badgeClass =
        "badge-fed";


      labelClass =
        "label-fed";

    }


    if (
      event.category
      === "macro"
    ) {

      type =
        "MACRO DATA";


      badgeClass =
        "badge-macro";


      labelClass =
        "label-macro";

    }


    let extra =
      "";


    if (
      event.category
      === "earnings"
    ) {

      const session =
        event.session
        === "pre-market"

          ? "PRE-MARKET"

          : event.session
            === "post-market"

              ? "AFTER CLOSE"

              : "TIME TBD";


      extra += `
        <div>
          ${session}
        </div>
      `;


      if (
        event.estimateEPS
      ) {

        extra += `
          <div>
            EPS Estimate:
            ${event.estimateEPS}
          </div>
        `;

      }

    }


    if (
      event.fullName
    ) {

      extra += `
        <div>
          ${event.fullName}
        </div>
      `;

    }


    return `
      <div class="event-card">

        <div class="event-top">

          <span
            class="event-badge ${badgeClass}"
          ></span>


          <div class="event-content">

            <div
              class="event-label ${labelClass}"
            >
              ${type}
            </div>


            <div class="event-title">
              ${event.title}
            </div>


            <div class="event-meta">

              ${extra}

              <div>
                Source:
                ${event.source || "—"}
              </div>

            </div>

          </div>

        </div>

      </div>
    `;

  }


  /* =========================================
     NEXT 7 DAYS
  ========================================= */

  function renderUpcoming() {

    const container =
      document.getElementById(
        "upcoming"
      );


    container.innerHTML =
      "";


    const today =
      new Date();


    today.setHours(
      0,
      0,
      0,
      0
    );


    const end =
      new Date(
        today
      );


    end.setDate(
      today.getDate()
      + 7
    );


    const upcoming =
      calendarData.filter(
        event => {

          const d =
            new Date(
              event.date
              + "T12:00:00"
            );


          return (
            d >= today
            &&
            d <= end
          );

        }
      );


    if (
      !upcoming.length
    ) {

      container.innerHTML = `
        <div class="upcoming-card">

          <div class="upcoming-date">
            QUIET WEEK
          </div>

          <div class="upcoming-title">
            未来 7 天暂无重大事件
          </div>

        </div>
      `;


      return;

    }


    upcoming.forEach(
      event => {

        const card =
          document.createElement(
            "div"
          );


        card.className =
          "upcoming-card";


        const d =
          new Date(
            event.date
            + "T12:00:00"
          );


        const dateLabel =
          new Intl.DateTimeFormat(
            "en-US",
            {
              month: "short",
              day: "numeric",
              weekday: "short"
            }
          )
          .format(d)
          .toUpperCase();


        let type =
          "EARNINGS";


        let badgeClass =
          "badge-earnings";


        if (
          event.category
          === "fed"
        ) {

          type =
            "FED / FOMC";


          badgeClass =
            "badge-fed";

        }


        if (
          event.category
          === "macro"
        ) {

          type =
            "MACRO";


          badgeClass =
            "badge-macro";

        }


        card.innerHTML = `
          <div class="upcoming-date">
            ${dateLabel}
          </div>

          <div class="upcoming-title-row">

            <span
              class="mini-badge ${badgeClass}"
            ></span>

            <div class="upcoming-title">
              ${event.title}
            </div>

          </div>

          <div class="upcoming-type">
            ${type}
          </div>
        `;


        card.onclick = () => {

          selectedDate =
            event.date;


          currentDate =
            new Date(
              event.date
              + "T12:00:00"
            );


          renderCalendar();


          showDay(
            event.date
          );

        };


        container.appendChild(
          card
        );

      }
    );

  }


  /* =========================================
     CONTROLS
  ========================================= */

  function changeMonth(
    amount
  ) {

    currentDate =
      new Date(
        currentDate.getFullYear(),
        currentDate.getMonth()
          + amount,
        1
      );


    selectedDate =
      null;


    renderCalendar();

  }


  function goToday() {

    currentDate =
      new Date();


    selectedDate =
      toDateString(
        new Date()
      );


    renderCalendar();


    showDay(
      selectedDate
    );

  }


  /* =========================================
     START
  ========================================= */

  loadData();

</script>

</body>
</html>
